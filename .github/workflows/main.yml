name: Project Verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Initialize database
        run: |
          PYTHONPATH=. python -c "from app.database.database import create_database; create_database()"

      - name: Start health server
        run: |
          PYTHONPATH=. python app/monitoring/health_server.py > health.log 2>&1 &
          sleep 5

      - name: Run automated tests
        env:
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Test health endpoint
        run: |
          echo "=== HEALTH ENDPOINT ==="
          curl -i http://127.0.0.1:9999/health

      - name: Start Flask dashboard
        run: |
          PYTHONPATH=. python -m app.app > flask.log 2>&1 &
          sleep 5

      - name: Test monitoring endpoint
        run: |
          echo "=== MONITOR ENDPOINT ==="
          curl -i http://127.0.0.1:5000/monitor

      - name: Measure health response time
        run: |
          echo "=== RESPONSE TIMES ==="
          for i in {1..20}; do
            curl -s -o /dev/null \
              -w "Request $i: %{time_total} seconds\n" \
              http://127.0.0.1:9999/health
          done

      - name: Count incident records
        run: |
          echo "=== INCIDENT DATABASE ==="
          PYTHONPATH=. python -c "import sqlite3; c=sqlite3.connect('incidents.db'); print('Incident records:', c.execute('SELECT COUNT(*) FROM incidents').fetchone()[0]); print('Records:', c.execute('SELECT * FROM incidents').fetchall()); c.close()"

      - name: Show logs
        if: always()
        run: |
          echo "=== HEALTH SERVER LOG ==="
          cat health.log || true
          echo "=== FLASK LOG ==="
          cat flask.log || true
