name: Project Verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run automated tests
        run: |
          pytest -v

      - name: Start Flask application
        run: |
          python app/app.py > flask.log 2>&1 &
          sleep 5

      - name: Test health endpoint
        run: |
          echo "=== HEALTH ENDPOINT ==="
          curl -i http://127.0.0.1:9999/health

      - name: Test monitoring endpoint
        run: |
          echo "=== MONITOR ENDPOINT ==="
          curl -i http://127.0.0.1:5000/monitor

      - name: Measure health response time
        run: |
          echo "=== RESPONSE TIMES ==="
          for i in {1..20}; do
            curl -s -o /dev/null \
              -w "Request $i: %{time_total} seconds\n" \
              http://127.0.0.1:9999/health
          done

      - name: Show Flask log
        if: always()
        run: |
          echo "=== FLASK LOG ==="
          cat flask.log || true
